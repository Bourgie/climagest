name: Daily DB Backup to Supabase Storage

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch: {}

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pg_dump + curl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 curl

      - name: Dump and upload to Supabase Storage
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          FILE="backup-$(date +%F).sql.gz"
          pg_dump \
            -h aws-0-sa-east-1.pooler.supabase.com \
            -p 6543 \
            -U postgres.jnbcnhdalkbazoapatoo \
            -d postgres \
            --no-owner --no-acl \
            | gzip > "$FILE"

          # Upload to Supabase Storage (bucket: db-backups)
          curl -X POST "https://jnbcnhdalkbazoapatoo.supabase.co/storage/v1/object/db-backups/$FILE" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/gzip" \
            --data-binary @"$FILE"

      - name: Cleanup
        run: rm -f backup-*.sql.gz